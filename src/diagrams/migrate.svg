<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 612" class="card-diagram" font-family="inherit" aria-hidden="true"><style>
.card-diagram{--ink:var(--home-ink,#14112e);--acc:var(--home-accent,#5b21b6);--mut:color-mix(in srgb,var(--ink) 62%,transparent);--ln:color-mix(in srgb,var(--ink) 28%,transparent);--card:color-mix(in srgb,#fff 78%,transparent);--tint:color-mix(in srgb,var(--acc) 10%,var(--card))}
@media (prefers-color-scheme:dark){.card-diagram{--card:color-mix(in srgb,#fff 7%,transparent);--tint:color-mix(in srgb,var(--acc) 16%,transparent)}}
.card-diagram .sec{font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--mut)}
.card-diagram .ttl{font-size:18px;font-weight:600;fill:var(--ink)}
.card-diagram .sub,.card-diagram .cap{font-size:18px;fill:var(--mut)}
.card-diagram .note{font-size:16px;fill:var(--mut)}
.card-diagram .box{fill:var(--card);stroke:color-mix(in srgb,var(--ink) 10%,transparent);stroke-width:1.25}
.card-diagram .box.dash{fill:color-mix(in srgb,var(--card) 55%,transparent);stroke:color-mix(in srgb,var(--ink) 18%,transparent);stroke-dasharray:5 5}
.card-diagram .chip{fill:color-mix(in srgb,var(--ink) 5%,transparent)}
.card-diagram .chip.ag{fill:var(--tint)}
.card-diagram .ctxt{font-size:18px;font-weight:500;fill:var(--ink)}
.card-diagram .ctxt.ag{font-weight:600;fill:var(--acc)}
.card-diagram .ic{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.card-diagram .ln{fill:none;stroke:var(--mut);stroke-width:1.25}
.card-diagram .ln.d{stroke-dasharray:4 4}
.card-diagram .al{fill:none;stroke:var(--acc);stroke-width:2}
.card-diagram .dot{fill:var(--acc)}
.card-diagram .head{fill:none;stroke:var(--mut);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.card-diagram .rule{stroke:var(--ln);stroke-width:1}
</style><defs><filter id="migrate-shadow" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#14112e" flood-opacity=".08"/></filter><marker id="migrate-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="head"/></marker></defs><text x="0" y="22" class="sec">Before: the Happy CLI</text><rect x="0" y="40" width="88" height="72" rx="14" class="box" filter="url(#migrate-shadow)"/><rect x="38.5" y="54" width="11" height="19" rx="2.5" class="ic"/><path d="M42.5 69.5h3" class="ic"/><text x="44.0" y="96" class="ttl" text-anchor="middle">Phone</text><rect x="120" y="40" width="228" height="72" rx="14" class="box" filter="url(#migrate-shadow)"/><path d="M229.0 70.5h10.5a4.2 4.2 0 0 0 .4-8.4 6 6 0 0 0-11.4 1.6 3.4 3.4 0 0 0 .5 6.8z" class="ic"/><text x="234.0" y="96" class="ttl" text-anchor="middle">Happy server</text><rect x="380" y="40" width="220" height="72" rx="14" class="box" filter="url(#migrate-shadow)"/><rect x="398.5" y="57" width="16" height="11" rx="1.5" class="ic"/><path d="M396 71.5h21" class="ic"/><text x="426" y="71" class="ttl">Your computer</text><text x="396" y="98" class="sub">happy in a terminal</text><path d="M94 76.0L114 76.0" class="ln" marker-end="url(#migrate-head)"/><path d="M354 76.0L374 76.0" class="ln" marker-end="url(#migrate-head)"/><text x="120" y="140" class="cap">Stores your chats, encrypted</text><path d="M0 168H600" class="rule"/><text x="0" y="206" class="sec">Now: Happy Agent</text><rect x="380" y="222" width="220" height="176" rx="16" class="box" filter="url(#migrate-shadow)"/><rect x="398.5" y="239" width="16" height="11" rx="1.5" class="ic"/><path d="M396 253.5h21" class="ic"/><text x="426" y="253" class="ttl">Your computer</text><rect x="396" y="270" width="180" height="44" rx="10" class="chip"/><text x="412" y="298.0" class="ctxt">Happy Desktop</text><rect x="396" y="334" width="180" height="44" rx="10" class="chip ag"/><text x="412" y="362.0" class="ctxt ag">Happy Agent</text><rect x="380" y="452" width="220" height="156" rx="16" class="box dash"/><rect x="397" y="467" width="19" height="7.5" rx="1.5" class="ic"/><rect x="397" y="477" width="19" height="7.5" rx="1.5" class="ic"/><path d="M400.5 470.75h2M400.5 480.75h2" class="ic"/><text x="426" y="483" class="ttl">Your server</text><text x="426" y="508" class="note">optional</text><rect x="396" y="548" width="180" height="44" rx="10" class="chip ag"/><text x="412" y="576.0" class="ctxt ag">Happy Agent</text><rect x="0" y="320.0" width="88" height="72" rx="14" class="box" filter="url(#migrate-shadow)"/><rect x="38.5" y="334.0" width="11" height="19" rx="2.5" class="ic"/><path d="M42.5 349.5h3" class="ic"/><text x="44.0" y="376.0" class="ttl" text-anchor="middle">Phone</text><path d="M94 356.0L390 356.0" class="ln d" marker-end="url(#migrate-head)"/><text x="102" y="316.0" class="cap">Relay</text><text x="102" y="340.0" class="cap">passes traffic, stores nothing</text><path d="M94 386.0L390 570.0" class="ln d" marker-end="url(#migrate-head)"/><text x="190.0" y="504.0" class="cap">Relay</text><path d="M576 356.0H588V570.0H576" class="al"/><circle cx="576" cy="356.0" r="3" class="dot"/><circle cx="576" cy="570.0" r="3" class="dot"/></svg>
