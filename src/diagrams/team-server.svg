<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 596" class="card-diagram" font-family="inherit" aria-hidden="true"><style>
.card-diagram{--ink:var(--home-ink,#14112e);--acc:var(--home-accent,#5b21b6);--mut:color-mix(in srgb,var(--ink) 62%,transparent);--ln:color-mix(in srgb,var(--ink) 28%,transparent);--card:color-mix(in srgb,#fff 78%,transparent);--tint:color-mix(in srgb,var(--acc) 10%,var(--card))}
@media (prefers-color-scheme:dark){.card-diagram{--card:color-mix(in srgb,#fff 7%,transparent);--tint:color-mix(in srgb,var(--acc) 16%,transparent)}}
.card-diagram .sec{font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--mut)}
.card-diagram .ttl{font-size:18px;font-weight:600;fill:var(--ink)}
.card-diagram .sub,.card-diagram .cap{font-size:18px;fill:var(--mut)}
.card-diagram .note{font-size:16px;fill:var(--mut)}
.card-diagram .box{fill:var(--card);stroke:color-mix(in srgb,var(--ink) 10%,transparent);stroke-width:1.25}
.card-diagram .box.dash{fill:color-mix(in srgb,var(--card) 55%,transparent);stroke:color-mix(in srgb,var(--ink) 18%,transparent);stroke-dasharray:5 5}
.card-diagram .chip{fill:color-mix(in srgb,var(--ink) 5%,transparent)}
.card-diagram .chip.ag{fill:var(--tint)}
.card-diagram .ctxt{font-size:18px;font-weight:500;fill:var(--ink)}
.card-diagram .ctxt.ag{font-weight:600;fill:var(--acc)}
.card-diagram .ic{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.card-diagram .ln{fill:none;stroke:var(--mut);stroke-width:1.25}
.card-diagram .ln.d{stroke-dasharray:4 4}
.card-diagram .al{fill:none;stroke:var(--acc);stroke-width:2}
.card-diagram .dot{fill:var(--acc)}
.card-diagram .head{fill:none;stroke:var(--mut);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.card-diagram .rule{stroke:var(--ln);stroke-width:1}
</style><defs><filter id="team-server-shadow" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#14112e" flood-opacity=".08"/></filter><marker id="team-server-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="head"/></marker></defs><text x="0" y="22" class="sec">Each member, signed in as themselves</text><rect x="0" y="40" width="184" height="124" rx="14" class="box" filter="url(#team-server-shadow)"/><circle cx="26.5" cy="60" r="4.5" class="ic"/><path d="M18 73.5a8.5 8.5 0 0 1 17 0" class="ic"/><text x="46" y="71" class="ttl">Ana</text><rect x="18.5" y="95" width="16" height="11" rx="1.5" class="ic"/><path d="M16 109.5h21" class="ic"/><text x="46" y="109" class="sub">Desktop</text><rect x="21" y="126" width="11" height="19" rx="2.5" class="ic"/><path d="M25 141.5h3" class="ic"/><text x="46" y="143" class="sub">Phone</text><rect x="208" y="40" width="184" height="124" rx="14" class="box" filter="url(#team-server-shadow)"/><circle cx="234.5" cy="60" r="4.5" class="ic"/><path d="M226 73.5a8.5 8.5 0 0 1 17 0" class="ic"/><text x="254" y="71" class="ttl">Ben</text><rect x="226.5" y="95" width="16" height="11" rx="1.5" class="ic"/><path d="M224 109.5h21" class="ic"/><text x="254" y="109" class="sub">Desktop</text><rect x="229" y="126" width="11" height="19" rx="2.5" class="ic"/><path d="M233 141.5h3" class="ic"/><text x="254" y="143" class="sub">Phone</text><rect x="416" y="40" width="184" height="124" rx="14" class="box" filter="url(#team-server-shadow)"/><circle cx="442.5" cy="60" r="4.5" class="ic"/><path d="M434 73.5a8.5 8.5 0 0 1 17 0" class="ic"/><text x="462" y="71" class="ttl">Chi</text><rect x="434.5" y="95" width="16" height="11" rx="1.5" class="ic"/><path d="M432 109.5h21" class="ic"/><text x="462" y="109" class="sub">Desktop</text><rect x="437" y="126" width="11" height="19" rx="2.5" class="ic"/><path d="M441 141.5h3" class="ic"/><text x="462" y="143" class="sub">Phone</text><path d="M92 172L92 284" class="ln" marker-end="url(#team-server-head)"/><text x="108" y="206" class="cap">Desktop: Tailcat</text><text x="108" y="230" class="note">WireGuard, no open port</text><path d="M400 172L400 284" class="ln d" marker-end="url(#team-server-head)"/><text x="416" y="206" class="cap">Phone: Happy relay</text><text x="416" y="230" class="note">end-to-end encrypted</text><rect x="0" y="292" width="600" height="304" rx="16" class="box" filter="url(#team-server-shadow)"/><rect x="17" y="307" width="19" height="7.5" rx="1.5" class="ic"/><rect x="17" y="317" width="19" height="7.5" rx="1.5" class="ic"/><path d="M20.5 310.75h2M20.5 320.75h2" class="ic"/><text x="46" y="323" class="ttl">Team server, on a machine you run</text><rect x="16" y="340" width="568" height="42" rx="10" class="chip ag"/><text x="32" y="367.0" class="ctxt ag">Happy Agent in team mode</text><rect x="16" y="390" width="568" height="42" rx="10" class="chip"/><text x="32" y="417.0" class="ctxt">Lets in only this team's sign-ins</text><rect x="16" y="440" width="568" height="42" rx="10" class="chip"/><text x="32" y="467.0" class="ctxt">Shared projects, tasks, and sessions</text><rect x="16" y="490" width="568" height="42" rx="10" class="chip"/><text x="32" y="517.0" class="ctxt">Claude, Codex, Grok: the server's accounts</text><rect x="16" y="540" width="568" height="42" rx="10" class="chip"/><text x="32" y="567.0" class="ctxt">OS sandbox, and review in Auto</text></svg>
